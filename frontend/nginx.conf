server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + generated images/heatmaps to the backend container
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;          # let the live stream through
    }
    location /data/ {
        proxy_pass http://api:8000;
    }
}
